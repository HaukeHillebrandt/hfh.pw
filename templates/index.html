<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{SITE_TITLE}}</title>
<meta name="description" content="{{DESCRIPTION}}">
<link rel="canonical" href="{{CANONICAL}}">
<meta property="og:title" content="{{SITE_TITLE}}">
<meta property="og:description" content="{{DESCRIPTION}}">
<meta property="og:type" content="website">
<meta property="og:image" content="{{OG_IMAGE}}">
<meta name="twitter:card" content="summary_large_image">
{{HEAD}}
<script type="application/ld+json">
{"@context":"https://schema.org","@type":"Person","name":"Hauke Hillebrandt",
 "url":"{{CANONICAL}}","alumniOf":"University College London",
 "sameAs":["https://hauke.substack.com","https://forum.effectivealtruism.org/users/haukehillebrandt",
           "https://github.com/HaukeHillebrandt","https://lets-fund.org"]}
</script>
</head>
<body class="home">
<a class="skip-link" href="#writing">Skip to writing</a>
{{HEADER}}
<main class="wrap">
  <section class="intro">
    <h1>{{NAME}}</h1>
    <p class="bio">{{BIO}}</p>
  </section>

  <section id="selected" aria-labelledby="selected-h">
    <h2 class="label" id="selected-h">Selected work</h2>
    <ol class="selected">
{{SELECTED}}
    </ol>
  </section>

  <section id="writing" aria-labelledby="writing-h">
    <div class="index-head">
      <h2 class="label" id="writing-h">Writing</h2>
      <div class="filters" role="group" aria-label="Filter posts">
        <button class="filter active" data-filter="all" aria-pressed="true">All <span>{{COUNT_ALL}}</span></button>
        <button class="filter" data-filter="essay" aria-pressed="false">Essays <span>{{COUNT_ESSAY}}</span></button>
        <button class="filter" data-filter="substack" aria-pressed="false">Substack <span>{{COUNT_SUBSTACK}}</span></button>
        <button class="filter" data-filter="note" aria-pressed="false">Notes <span>{{COUNT_NOTE}}</span></button>
      </div>
      <input id="search" type="search" placeholder="Search posts" aria-label="Search posts (shortcut: /)">
    </div>
    <ul class="index">
{{POSTS}}
    </ul>
    <p class="empty" hidden>No posts match.</p>
  </section>

  <section id="projects" aria-labelledby="projects-h">
    <h2 class="label" id="projects-h">Projects</h2>
    <ul class="projects">{{PROJECTS}}</ul>
  </section>
</main>
{{FOOTER}}
<script src="app.js"></script>
</body>
</html>
