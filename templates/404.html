<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Not found — Hauke Hillebrandt</title>
{{HEAD}}
</head>
<body>
{{HEADER}}
<main class="wrap notfound">
  <h1>Page not found</h1>
  <p>This page doesn’t exist or has moved. Everything is listed on the <a href="{{BASE}}/">homepage</a>.</p>
  <p id="suggestion" hidden>Were you looking for <a id="suggestion-link" href=""></a>?</p>
</main>
{{FOOTER}}
<script>
(function () {
  var want = location.pathname.split('/').pop().replace(/\.html$/, '').toLowerCase();
  if (!want) return;
  fetch('{{BASE}}/posts.json').then(function (r) { return r.json(); }).then(function (posts) {
    function norm(s) { return s.toLowerCase().replace(/[^a-z0-9]+/g, ''); }
    var w = norm(want), best = null, bestScore = 0;
    posts.forEach(function (p) {
      var s = norm(p.slug), t = norm(p.title), score = 0;
      if (s === w || t === w) score = 3;
      else if (s.indexOf(w) !== -1 || w.indexOf(s) !== -1) score = 2;
      else if (t.indexOf(w) !== -1) score = 1;
      if (score > bestScore) { bestScore = score; best = p; }
    });
    if (best) {
      var a = document.getElementById('suggestion-link');
      a.href = '{{BASE}}/' + best.slug;
      a.textContent = best.title;
      document.getElementById('suggestion').hidden = false;
    }
  }).catch(function () {});
})();
</script>
</body>
</html>
