<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{TITLE}} — {{SITE_TITLE}}</title>
<meta name="description" content="{{DESCRIPTION}}">
<link rel="canonical" href="{{CANONICAL}}">
<meta property="og:title" content="{{TITLE}}">
<meta property="og:description" content="{{DESCRIPTION}}">
<meta property="og:type" content="article">
<meta property="og:image" content="{{OG_IMAGE}}">
<meta name="twitter:card" content="summary_large_image">
<meta name="theme-color" content="#faf9f6" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#16150f" media="(prefers-color-scheme: dark)">
<link rel="preconnect" href="https://docs.google.com">
{{JSONLD}}
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="style.css">
</head>
<body class="doc-page">
<header class="doc-bar">
  <a class="site-name" href="./">Hauke Hillebrandt</a>
  <span class="doc-title" title="{{TITLE}}">{{TITLE}}<span class="doc-date"> · {{DATE}}</span></span>
  <span class="doc-actions">
    {{READER_LINK}}
    <a class="btn primary" href="{{DOC_URL}}" target="_blank" rel="noopener">Open in Google Docs ↗</a>
  </span>
</header>
<iframe class="{{FRAME_CLASS}}" src="{{EMBED_URL}}" title="{{TITLE}}" loading="eager"
        sandbox="allow-scripts allow-popups allow-forms allow-same-origin allow-popups-to-escape-sandbox allow-downloads allow-modals"></iframe>
</body>
</html>
