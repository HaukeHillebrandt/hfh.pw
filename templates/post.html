<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{TITLE}} — {{SITE_TITLE}}</title>
<meta name="description" content="{{DESCRIPTION}}">
<link rel="canonical" href="{{CANONICAL}}">
<meta property="og:title" content="{{TITLE}}">
<meta property="og:description" content="{{DESCRIPTION}}">
<meta property="og:type" content="article">
<meta property="og:image" content="{{OG_IMAGE}}">
<meta name="twitter:card" content="summary_large_image">
{{HEAD}}
<link rel="preconnect" href="https://docs.google.com">
{{JSONLD}}
</head>
<body class="doc-page">
<header class="doc-bar">
  <a class="wordmark" href="./"><span class="mark" aria-hidden="true"></span><span class="wm-text">Hauke Hillebrandt</span></a>
  <p class="doc-title"><strong>{{TITLE}}</strong> <span class="doc-date">{{DATE}}</span></p>
  <div class="doc-actions">
    {{READER_LINK}}
    <a class="btn primary" href="{{DOC_URL}}" target="_blank" rel="noopener">Open in Google Docs <span aria-hidden="true">↗</span></a>
  </div>
</header>
<iframe class="{{FRAME_CLASS}}" src="{{EMBED_URL}}" title="{{TITLE}}" loading="eager"
        sandbox="allow-scripts allow-popups allow-forms allow-same-origin allow-popups-to-escape-sandbox allow-downloads allow-modals"></iframe>
</body>
</html>
